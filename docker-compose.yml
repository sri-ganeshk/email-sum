version: "3.9"

services:
  ml-service:
    build:
      context: ./ml-service
      args:
        MODEL_NAME: sshleifer/distilbart-cnn-12-6
    ports:
      - "8000:8000"
    env_file:
      - ./ml-service/.env
    volumes:
      # Persist HuggingFace model weights across rebuilds
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # allow time for model loading

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      # Override ML_SERVICE_URL to use Docker internal DNS
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      ml-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  hf_cache:
